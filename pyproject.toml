[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ide-audit"
version = "0.4.12"
description = "IDE_Audit — AI IDE 架构审计插件，通过 git diff + 用户需求自动检测超出范围的架构变更"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "lndlwh2024"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "mcp>=2.2.0,<2.3",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
archguard = "archguard.cli.main:cli"
ide-audit-mcp = "archguard.mcp.server:run_mcp_server"

[tool.setuptools.package-data]
"archguard.rules" = ["*.yaml"]
"archguard" = ["templates/*.md", "templates/*.j2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["archguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
